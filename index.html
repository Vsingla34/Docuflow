    <style>
      body { background-color: #F1F5F9; }
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fade-in-up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes scale-in { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      .animate-fade-in-up { animation: fade-in-up 0.25s ease-out forwards; }
      .animate-fade-in { animation: fade-in 0.2s ease-out forwards; }
      .animate-scale-in { animation: scale-in 0.18s ease-out forwards; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>
